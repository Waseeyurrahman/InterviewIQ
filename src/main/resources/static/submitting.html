<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <title>Evaluating... | InterviewIQ AI</title>

    <link rel="stylesheet" href="style.css" />

    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
    />
</head>

<body class="submitting-page">

<div class="eval-card">

    <div class="spinner"></div>

    <h1 class="submit-title">
        Evaluation in Progress...
    </h1>

    <p class="submit-subtitle" id="statusText">
        Please wait while we analyze your answers
    </p>

    <ul class="eval-steps" id="evalSteps">

        <li>
            <span class="step-icon">⬜</span>
            Analyzing Content
        </li>

        <li>
            <span class="step-icon">⬜</span>
            Checking Technical Accuracy
        </li>

        <li>
            <span class="step-icon">⬜</span>
            Evaluating Clarity
        </li>

        <li>
            <span class="step-icon">⬜</span>
            Measuring Confidence
        </li>

    </ul>

</div>

<script src="api.js"></script>

<script>

    /*
     * ============================================================
     * GET INTERVIEW ID + ANSWERS
     * ============================================================
     */

    const interviewId =
        localStorage.getItem("interviewId");

    const answers =
        JSON.parse(
            localStorage.getItem("answers") || "[]"
        );


    /*
     * ============================================================
     * VISUAL PROGRESS
     * ============================================================
     */

    const steps =
        document.querySelectorAll(
            "#evalSteps .step-icon"
        );

    let stepIndex = 0;

    const progressTimer =
        setInterval(() => {

            if (stepIndex < steps.length) {

                steps[stepIndex].textContent = "✔";

                stepIndex++;
            }

            if (stepIndex >= steps.length) {

                clearInterval(progressTimer);
            }

        }, 700);


    /*
     * ============================================================
     * SAFETY CHECK
     * ============================================================
     */

    if (!interviewId) {

        document.getElementById("statusText").textContent =
            "⚠️ Interview session not found.";

        clearInterval(progressTimer);

        throw new Error(
            "No interviewId found in localStorage."
        );
    }


    /*
     * ============================================================
     * CHECK ANSWERS
     * ============================================================
     */

    if (!answers.length) {

        document.getElementById("statusText").textContent =
            "⚠️ No interview answers found.";

        clearInterval(progressTimer);

        throw new Error(
            "No answers found in localStorage."
        );
    }


    console.log(
        "[submitting] interviewId:",
        interviewId
    );

    console.log(
        "[submitting] answers:",
        answers
    );


    /*
     * ============================================================
     * MAIN EVALUATION FLOW
     * ============================================================
     *
     * STEP 1:
     * Save answers to database.
     *
     * STEP 2:
     * Ask backend to evaluate the interview.
     *
     * STEP 3:
     * Save evaluation result.
     *
     * STEP 4:
     * Redirect to result.html.
     *
     * ============================================================
     */

    (async function evaluateInterview() {

        try {

             const token =
    localStorage.getItem("token");

if (!token) {

    alert(
        "Your session has expired. Please login again."
    );

    window.location.href =
        "login.html";

    return;
}

            /*
             * ====================================================
             * STEP 1 — SAVE ANSWERS
             * ====================================================
             */

            document.getElementById("statusText").textContent =
                "Saving your answers...";


            console.log(
                "[submitting] Saving answers to backend..."
            );


            const saveResponse =
                await submitAnswersToBackend(answers);


            console.log(
                "[submitting] Answers saved:",
                saveResponse
            );

            /*
 * ====================================================
 * STEP 2 — FINISH INTERVIEW
 * ====================================================
 */

document.getElementById("statusText").textContent =
    "Completing your interview...";

console.log(
    "[submitting] Finishing interview:",
    interviewId
);

const finishResponse =
    await fetch(
        "/interview/" +
        interviewId +
        "/finish",
        {
            method: "POST",
            headers: {
                "Authorization":
                    "Bearer " + token
            }
        }
    );

if (!finishResponse.ok) {

    const errorText =
        await finishResponse.text();

    console.error(
        "[submitting] Interview finish failed:",
        finishResponse.status,
        errorText
    );

    throw new Error(
        "Failed to finish interview. HTTP " +
        finishResponse.status
    );
}

console.log(
    "[submitting] Interview finished successfully"
);


            /*
             * ====================================================
             * STEP 3 — EVALUATE INTERVIEW
             * ====================================================
             */

            document.getElementById("statusText").textContent =
                "Analyzing your answers with AI...";


            console.log(
                "[submitting] Evaluating interview:",
                interviewId
            );


            const response =
                await fetch(
                    "/interviews/" +
                    interviewId +
                    "/evaluate",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            /*
             * ====================================================
             * HTTP ERROR
             * ====================================================
             */

            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "[submitting] Evaluation failed:",
                    response.status,
                    errorText
                );

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );
            }


            /*
             * ====================================================
             * READ BACKEND RESULT
             * ====================================================
             */

            const data =
                await response.json();


            console.log(
                "[submitting] Evaluation result:",
                data
            );


            /*
             * ====================================================
             * SAVE RESULT FOR result.html
             * ====================================================
             */

            const result = {

                score:
                    data.score ?? 0,

                fillerWords:
                    data.fillerWords ?? 0,

                confidence:
                    data.confidence ?? 0,

                relevance:
                    data.relevance ?? "medium",

                strengths:
                    data.strengths ?? [],

                weaknesses:
                    data.weaknesses ?? [],

                suggestions:
                    data.recommendations ?? [],

                aiAvailable:
                    data.aiAvailable ?? false,

                answeredCount:
                    answers.length
            };


            localStorage.setItem(
                "result",
                JSON.stringify(result)
            );


            /*
             * ====================================================
             * DONE
             * ====================================================
             */

            document.getElementById("statusText").textContent =
                data.aiAvailable
                    ? "Evaluation complete. Preparing your results..."
                    : "Evaluation completed with limited AI availability.";


            setTimeout(() => {

                window.location.href =
                    "result.html";

            }, 1200);


        } catch (error) {

            console.error(
                "[submitting] Evaluation error:",
                error
            );


            clearInterval(
                progressTimer
            );


            document.getElementById("statusText").textContent =
                "⚠️ Evaluation failed. Please try again.";


            if (stepIndex < steps.length) {

                steps[stepIndex].textContent =
                    "⚠";

            } else if (steps.length > 0) {

                steps[steps.length - 1].textContent =
                    "⚠";
            }

        }

    })();

</script>

</body>
</html>
