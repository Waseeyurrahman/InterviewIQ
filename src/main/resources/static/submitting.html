 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <title>Evaluating... | InterviewIQ AI</title>

    <link rel="stylesheet" href="style.css" />

    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
    />

</head>


<body class="submitting-page">


<div class="eval-card">

    <div class="spinner"></div>


    <h1 class="submit-title">
        Evaluation in Progress...
    </h1>


    <p class="submit-subtitle" id="statusText">
        Please wait while we analyze your answers
    </p>


    <ul class="eval-steps" id="evalSteps">

        <li>
            <span class="step-icon">⬜</span>
            Analyzing Content
        </li>

        <li>
            <span class="step-icon">⬜</span>
            Checking Technical Accuracy
        </li>

        <li>
            <span class="step-icon">⬜</span>
            Evaluating Clarity
        </li>

        <li>
            <span class="step-icon">⬜</span>
            Measuring Confidence
        </li>

    </ul>

</div>


<!-- =========================================================
     CENTRALIZED API CLIENT
     ========================================================= -->

<script src="api.js"></script>


<script>

    /* =========================================================
       AUTHENTICATION
       ========================================================= */

    try {

        getToken();

    }

    catch (error) {

        alert(
            "Your session has expired. Please login again."
        );

        window.location.href =
            "login.html";

        throw error;

    }


    /* =========================================================
       GET INTERVIEW ID FROM URL
       ========================================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const interviewId =
        params.get("interviewId");


    if (!interviewId) {

        document.getElementById(
            "statusText"
        ).textContent =
            "⚠️ Interview session not found.";

        throw new Error(
            "No interviewId was provided in the URL."
        );

    }


    if (!/^\d+$/.test(interviewId)) {

        document.getElementById(
            "statusText"
        ).textContent =
            "⚠️ Invalid interview session.";

        throw new Error(
            "Invalid interviewId."
        );

    }


    console.log(
        "[submitting] interviewId:",
        interviewId
    );


    /* =========================================================
       VISUAL PROGRESS
       ========================================================= */

    const steps =
        document.querySelectorAll(
            "#evalSteps .step-icon"
        );


    let stepIndex = 0;


    const progressTimer =
        setInterval(() => {

            if (
                stepIndex <
                steps.length
            ) {

                steps[
                    stepIndex
                ].textContent = "✔";

                stepIndex++;

            }


            if (
                stepIndex >=
                steps.length
            ) {

                clearInterval(
                    progressTimer
                );

            }

        }, 900);


    /* =========================================================
       MAIN EVALUATION FLOW
       ========================================================= */

    (async function runEvaluation() {

        try {

            /* =================================================
               STEP 1 — EVALUATE INTERVIEW
               ================================================= */

            document.getElementById(
                "statusText"
            ).textContent =
                "Analyzing your answers with AI...";


            console.log(
                "[submitting] Evaluating interview:",
                interviewId
            );


            const data =
                await evaluateInterview(
                    interviewId
                );


            console.log(
                "[submitting] Evaluation result:",
                data
            );


            /* =================================================
               STEP 2 — VALIDATE RESPONSE
               ================================================= */

            if (!data) {

                throw new Error(
                    "Server returned an empty evaluation."
                );

            }


            /* =================================================
               STEP 3 — COMPLETE VISUAL PROGRESS
               ================================================= */

            clearInterval(
                progressTimer
            );


            steps.forEach(
                step =>
                    step.textContent = "✔"
            );


            document.getElementById(
                "statusText"
            ).textContent =
                data.aiAvailable
                    ? "Evaluation complete. Preparing your results..."
                    : "Evaluation completed with limited AI availability.";


            /* =================================================
               STEP 4 — REDIRECT
               ================================================= */

            setTimeout(() => {

                window.location.href =
                    "result.html?interviewId=" +
                    encodeURIComponent(
                        interviewId
                    );

            }, 1000);


        }

        catch (error) {

            console.error(
                "[submitting] Evaluation error:",
                error
            );


            clearInterval(
                progressTimer
            );


            document.getElementById(
                "statusText"
            ).textContent =
                "⚠️ Evaluation failed. Please try again.";


            if (
                stepIndex <
                steps.length
            ) {

                steps[
                    stepIndex
                ].textContent = "⚠";

            }


            /*
             * Don't automatically redirect.
             * The user needs to see the error.
             */

        }

    })();

</script>


</body>

</html>
