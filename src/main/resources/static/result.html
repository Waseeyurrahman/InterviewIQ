<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Interview Result - InterviewIQ AI</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Poppins -->
    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer">

    <style>

        /* ============================================================
           RESULT PAGE
           ============================================================ */

        .result-page {
            min-height: 100vh;
            background: #F9FAFB;
            font-family: 'Poppins', sans-serif;
        }


        .result-shell {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 32px 40px;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* ============================================================
           HEADER
           ============================================================ */

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }


        .result-title h1 {
            margin: 0;

            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 24px;
            font-weight: 600;
            color: #111827;
        }


        .result-title h1 i {
            color: #6C63FF;
            font-size: 20px;
        }


        .result-subtitle {
            margin: 5px 0 0;

            color: #6B7280;
            font-size: 13px;
        }


        .result-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .result-action {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 9px 14px;

            border-radius: 8px;

            font-family: 'Poppins', sans-serif;
            font-size: 12.5px;
            font-weight: 500;

            cursor: pointer;
            text-decoration: none;

            transition:
                    background 0.2s ease,
                    border-color 0.2s ease,
                    transform 0.2s ease;
        }


        .result-action.secondary {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            color: #374151;
        }


        .result-action.secondary:hover {
            background: #F3F4F6;
        }


        .result-action.primary {
            background: linear-gradient(
                    90deg,
                    #6C63FF,
                    #7A70FF
            );

            border: 1px solid transparent;
            color: #FFFFFF;

            box-shadow:
                    0 4px 12px
                    rgba(108, 99, 255, 0.22);
        }


        .result-action.primary:hover {
            transform: translateY(-1px);

            box-shadow:
                    0 7px 16px
                    rgba(108, 99, 255, 0.30);
        }


        /* ============================================================
           CARD
           ============================================================ */

        .result-card {
            background: #FFFFFF;

            border: 1px solid #E8E8EF;
            border-radius: 14px;

            padding: 20px;

            box-shadow:
                    0 4px 18px
                    rgba(20, 20, 40, 0.04);
        }


        .result-card-title {
            display: flex;
            align-items: center;
            gap: 8px;

            margin: 0 0 15px;

            color: #252633;

            font-size: 15px;
            font-weight: 600;
        }


        .result-card-title i {
            color: #6C63FF;
            font-size: 14px;
        }


        /* ============================================================
           SCORE HERO
           ============================================================ */

        .score-card {
            display: flex;
            align-items: center;
            gap: 24px;

            padding: 22px 24px;
        }


        .score-ring {
            position: relative;

            width: 108px;
            height: 108px;

            flex-shrink: 0;
        }


        .score-ring svg {
            width: 100%;
            height: 100%;

            transform: rotate(-90deg);
        }


        .score-ring-track {
            fill: none;

            stroke: #EEF0F4;

            stroke-width: 9;
        }


        .score-ring-fill {
            fill: none;

            stroke: #6C63FF;

            stroke-width: 9;

            stroke-linecap: round;

            stroke-dasharray: 283;
            stroke-dashoffset: 283;

            transition:
                    stroke-dashoffset 1s
                    cubic-bezier(.2,.8,.2,1),
                    stroke 0.3s ease;
        }


        .score-ring-content {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }


        .score-number {
            color: #6C63FF;

            font-size: 27px;
            font-weight: 700;

            line-height: 1;
        }


        .score-denominator {
            margin-top: 3px;

            color: #9CA3AF;

            font-size: 10px;
            font-weight: 500;
        }


        .score-content {
            flex: 1;
        }


        .score-eyebrow {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-bottom: 5px;

            color: #6B7280;

            font-size: 11px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.6px;
        }


        .score-eyebrow i {
            color: #6C63FF;
        }


        .score-label {
            margin-bottom: 4px;

            color: #111827;

            font-size: 21px;
            font-weight: 600;
        }


        .score-description {
            color: #6B7280;

            font-size: 12.5px;
            line-height: 1.5;
        }


        /* ============================================================
           BREAKDOWN
           ============================================================ */

        .breakdown-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }


        .breakdown-row {
            display: grid;

            grid-template-columns:
                    160px 1fr 55px;

            align-items: center;

            gap: 14px;
        }


        .breakdown-label {
            color: #374151;

            font-size: 12.5px;
            font-weight: 500;
        }


        .breakdown-track {
            height: 7px;

            overflow: hidden;

            border-radius: 999px;

            background: #EEF0F4;
        }


        .breakdown-fill {
            width: 0;
            height: 100%;

            border-radius: 999px;

            transition:
                    width 0.9s
                    cubic-bezier(.2,.8,.2,1);
        }


        .breakdown-fill.good {
            background: #22C55E;
        }


        .breakdown-fill.medium {
            background: #F59E0B;
        }


        .breakdown-fill.low {
            background: #EF4444;
        }


        .breakdown-value {
            text-align: right;

            color: #111827;

            font-size: 12px;
            font-weight: 600;
        }


        /* ============================================================
           FEEDBACK GRID
           ============================================================ */

        .feedback-grid {
            display: grid;

            grid-template-columns:
                    repeat(3, minmax(0, 1fr));

            gap: 14px;
        }


        .feedback-card {
            min-width: 0;
        }


        .feedback-card.strengths
        .result-card-title i {
            color: #22C55E;
        }


        .feedback-card.weaknesses
        .result-card-title i {
            color: #EF4444;
        }


        .feedback-card.recommendations
        .result-card-title i {
            color: #6C63FF;
        }


        .feedback-list {
            display: flex;

            flex-direction: column;

            gap: 9px;

            list-style: none;

            padding: 0;
            margin: 0;
        }


        .feedback-list li {
            display: flex;

            align-items: flex-start;

            gap: 9px;

            color: #4B5563;

            font-size: 12.5px;
            line-height: 1.5;
        }


        .feedback-icon {
            width: 18px;
            height: 18px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            margin-top: 1px;

            font-size: 8px;
        }


        .strengths .feedback-icon {
            background: #ECFDF5;
            color: #22C55E;
        }


        .weaknesses .feedback-icon {
            background: #FEF2F2;
            color: #EF4444;
        }


        .recommendations .feedback-icon {
            background: #EEF2FF;
            color: #6C63FF;
        }


        .feedback-empty {
            color: #9CA3AF;

            font-size: 12px;

            line-height: 1.5;
        }


        /* ============================================================
           DETAILED EVALUATION
           ============================================================ */

        .details-list {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .detail-card {
            padding: 17px;

            border: 1px solid #E5E7EB;
            border-radius: 11px;

            background: #FFFFFF;

            transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease,
                    transform 0.2s ease;
        }


        .detail-card:hover {
            border-color: #DCD9FF;

            box-shadow:
                    0 6px 18px
                    rgba(108, 99, 255, 0.07);

            transform: translateY(-1px);
        }


        .detail-top {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 9px;
        }


        .question-number {
            color: #6B7280;

            font-size: 12px;
            font-weight: 600;
        }


        .question-score {
            color: #6C63FF;

            font-size: 14px;
            font-weight: 600;
        }


        .detail-question {
            margin-bottom: 11px;

            color: #111827;

            font-size: 14px;
            font-weight: 600;

            line-height: 1.5;
        }


        .detail-meta {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 15px;
        }


        .detail-feedback {
            display: grid;

            grid-template-columns:
                    repeat(3, minmax(0, 1fr));

            gap: 14px;
        }


        .detail-feedback-section {
            min-width: 0;
        }


        .detail-feedback-section h4 {
            margin: 0 0 7px;

            color: #374151;

            font-size: 11.5px;
            font-weight: 600;
        }


        .detail-feedback-section ul {
            margin: 0;

            padding-left: 17px;
        }


        .detail-feedback-section li {
            margin-bottom: 5px;

            color: #6B7280;

            font-size: 11.5px;
            line-height: 1.5;
        }


        .details-empty {
            padding: 22px;

            text-align: center;

            color: #9CA3AF;

            font-size: 12px;

            background: #FAFAFD;

            border-radius: 10px;
        }


        /* ============================================================
           ERROR / EMPTY
           ============================================================ */

        .result-state {
            min-height: 360px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        .result-state-content {
            max-width: 420px;
        }


        .result-state-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #EFEDFF;
            color: #6C63FF;

            font-size: 20px;
        }


        .result-state h2 {
            margin-bottom: 7px;

            color: #111827;

            font-size: 20px;
            font-weight: 600;
        }


        .result-state p {
            margin-bottom: 18px;

            color: #6B7280;

            font-size: 13px;
            line-height: 1.6;
        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 900px) {

            .feedback-grid {
                grid-template-columns: 1fr;
            }


            .detail-feedback {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 700px) {

            .result-shell {
                padding: 20px 16px 30px;
            }


            .result-header {
                align-items: flex-start;

                flex-direction: column;
            }


            .result-actions {
                width: 100%;
            }


            .result-action {
                flex: 1;

                justify-content: center;
            }


            .score-card {
                flex-direction: column;

                text-align: center;

                padding: 20px;
            }


            .score-eyebrow {
                justify-content: center;
            }


            .breakdown-row {
                grid-template-columns: 1fr;

                gap: 5px;
            }


            .breakdown-value {
                text-align: left;
            }

        }

    </style>

</head>


<body class="result-page">


<div class="result-shell" id="resultShell">


    <!-- ============================================================
         HEADER
         ============================================================ -->

    <header class="result-header">

        <div class="result-title">

            <h1>

                <i class="fa-solid fa-chart-line"></i>

                Interview Result

            </h1>


            <p class="result-subtitle">

                Here's how you performed in your
                <span id="roleLabel">interview</span>.

            </p>

        </div>


        <div class="result-actions">

            <a
                    href="dashboard.html"
                    class="result-action secondary">

                <i class="fa-solid fa-arrow-left"></i>

                Dashboard

            </a>


            <a
                    href="setup-interview.html"
                    class="result-action primary">

                <i class="fa-solid fa-rotate-right"></i>

                Try Again

            </a>

        </div>

    </header>


    <!-- ============================================================
         SCORE
         ============================================================ -->

    <section class="result-card score-card">


        <div class="score-ring">

            <svg
                    viewBox="0 0 100 100"
                    aria-hidden="true">

                <circle
                        class="score-ring-track"
                        cx="50"
                        cy="50"
                        r="45">
                </circle>


                <circle
                        id="scoreRing"
                        class="score-ring-fill"
                        cx="50"
                        cy="50"
                        r="45">
                </circle>

            </svg>


            <div class="score-ring-content">

                <span
                        id="scoreValue"
                        class="score-number">
                    --
                </span>

                <span class="score-denominator">
                    / 100
                </span>

            </div>

        </div>


        <div class="score-content">

            <div class="score-eyebrow">

                <i class="fa-solid fa-bullseye"></i>

                Overall Performance

            </div>


            <div
                    id="scoreLabel"
                    class="score-label">

                Loading...

            </div>


            <p class="score-description">

                You answered
                <strong id="answeredCount">0</strong>
                questions during this interview.

            </p>

        </div>

    </section>


    <!-- ============================================================
         SCORE BREAKDOWN
         ============================================================ -->

    <section class="result-card">

        <h3 class="result-card-title">

            <i class="fa-solid fa-chart-column"></i>

            Score Breakdown

        </h3>


        <div
                id="breakdown"
                class="breakdown-list">

        </div>

    </section>


    <!-- ============================================================
         FEEDBACK
         ============================================================ -->

    <section class="feedback-grid">


        <!-- Strengths -->

        <div class="result-card feedback-card strengths">

            <h3 class="result-card-title">

                <i class="fa-solid fa-circle-check"></i>

                Strengths

            </h3>


            <ul
                    id="strengthsList"
                    class="feedback-list">

            </ul>

        </div>


        <!-- Weaknesses -->

        <div class="result-card feedback-card weaknesses">

            <h3 class="result-card-title">

                <i class="fa-solid fa-triangle-exclamation"></i>

                Areas to Improve

            </h3>


            <ul
                    id="weaknessesList"
                    class="feedback-list">

            </ul>

        </div>


        <!-- Recommendations -->

        <div class="result-card feedback-card recommendations">

            <h3 class="result-card-title">

                <i class="fa-solid fa-lightbulb"></i>

                Recommendations

            </h3>


            <ul
                    id="suggestionsList"
                    class="feedback-list">

            </ul>

        </div>

    </section>


    <!-- ============================================================
         DETAILED EVALUATION
         ============================================================ -->

    <section class="result-card">

        <h3 class="result-card-title">

            <i class="fa-solid fa-clipboard-check"></i>

            Answer-by-Answer Evaluation

        </h3>


        <div
                id="detailsContainer"
                class="details-list">

            <div class="details-empty">

                Loading detailed evaluations...

            </div>

        </div>

    </section>


</div>


<!-- ============================================================
     API
     ============================================================ -->

<script src="auth-guard.js"></script>
<script src="api.js"></script>


<script>

    /* ============================================================
       INTERVIEW ID
       ============================================================ */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const interviewId =
        params.get("interviewId");


    if (
        !interviewId ||
        !/^\d+$/.test(interviewId)
    ) {

        showError(
            "Invalid interview session",
            "Please start an interview first."
        );

        throw new Error(
            "Missing or invalid interviewId."
        );

    }


    /* ============================================================
       HTML ESCAPE
       ============================================================ */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /[&<>"']/g,
                character => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[character])
            );

    }


    /* ============================================================
       SCORE HELPERS
       ============================================================ */

    function getScoreLabel(score) {

        if (score >= 90) {

            return "Excellent";

        }


        if (score >= 75) {

            return "Very Good";

        }


        if (score >= 60) {

            return "Good";

        }


        if (score >= 40) {

            return "Needs Improvement";

        }


        return "Needs Significant Improvement";

    }


    function getScoreTone(score) {

        if (score >= 70) {

            return "good";

        }


        if (score >= 40) {

            return "medium";

        }


        return "low";

    }


    /* ============================================================
       SCORE RING
       ============================================================ */

    function renderScore(score) {

        const safeScore =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(score) || 0
                )
            );


        const scoreValue =
            document.getElementById(
                "scoreValue"
            );


        const scoreLabel =
            document.getElementById(
                "scoreLabel"
            );


        const scoreRing =
            document.getElementById(
                "scoreRing"
            );


        scoreValue.textContent =
            safeScore;


        scoreLabel.textContent =
            getScoreLabel(
                safeScore
            );


        let ringColor;


        if (safeScore >= 70) {

            ringColor = "#22C55E";

        }

        else if (safeScore >= 40) {

            ringColor = "#F59E0B";

        }

        else {

            ringColor = "#EF4444";

        }


        scoreValue.style.color =
            ringColor;


        scoreRing.style.stroke =
            ringColor;


        const circumference = 283;


        const offset =
            circumference -
            (
                safeScore / 100
            ) *
            circumference;


        requestAnimationFrame(
            () => {

                scoreRing.style.strokeDashoffset =
                    offset;

            }
        );

    }


    /* ============================================================
       RELEVANCE SCORE
       ============================================================ */

    function relevanceToScore(
        relevance
    ) {

        switch (
            String(relevance || "")
                .toLowerCase()
        ) {

            case "high":
                return 100;

            case "medium":
                return 75;

            case "low":
                return 40;

            default:
                return 0;

        }

    }


    /* ============================================================
       BREAKDOWN
       ============================================================ */

    function renderBreakdown(
        score,
        relevance,
        fillerWords
    ) {

        const communication =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(score) -
                    (
                        Number(fillerWords) * 2
                    )
                )
            );


        const breakdown = [

            {
                label: "Overall Score",
                value: score
            },

            {
                label: "Answer Relevance",
                value: relevance
            },

            {
                label: "Communication",
                value: communication
            }

        ];


        document.getElementById(
            "breakdown"
        ).innerHTML =

            breakdown
                .map(
                    item => {

                        const value =
                            Math.round(
                                Math.max(
                                    0,
                                    Math.min(
                                        100,
                                        Number(item.value) || 0
                                    )
                                )
                            );


                        return `

                            <div class="breakdown-row">

                                <div class="breakdown-label">

                                    ${escapeHtml(
                                        item.label
                                    )}

                                </div>


                                <div class="breakdown-track">

                                    <div
                                        class="breakdown-fill ${getScoreTone(value)}"
                                        style="width:${value}%">
                                    </div>

                                </div>


                                <div class="breakdown-value">

                                    ${value}%

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");

    }


    /* ============================================================
       FEEDBACK LIST
       ============================================================ */

    function renderFeedbackList(
        elementId,
        items,
        type,
        emptyMessage
    ) {

        const container =
            document.getElementById(
                elementId
            );


        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            container.innerHTML = `

                <li>

                    <span class="feedback-empty">

                        ${escapeHtml(
                            emptyMessage
                        )}

                    </span>

                </li>

            `;

            return;

        }


        let icon =
            "fa-check";


        if (type === "weakness") {

            icon =
                "fa-arrow-up";

        }


        if (type === "recommendation") {

            icon =
                "fa-lightbulb";

        }


        container.innerHTML =

            [
                ...new Set(
                    items
                        .filter(
                            item =>
                                item !== null &&
                                item !== undefined &&
                                String(item).trim()
                        )
                        .map(
                            item =>
                                String(item)
                        )
                )
            ]
            .map(
                item => `

                    <li>

                        <span class="feedback-icon">

                            <i class="fa-solid ${icon}"></i>

                        </span>

                        <span>

                            ${escapeHtml(item)}

                        </span>

                    </li>

                `
            )
            .join("");

    }


    /* ============================================================
       DETAILED EVALUATIONS
       ============================================================ */

    function renderDetailedEvaluations(
        evaluations
    ) {

        const container =
            document.getElementById(
                "detailsContainer"
            );


        if (
            !Array.isArray(evaluations) ||
            evaluations.length === 0
        ) {

            container.innerHTML = `

                <div class="details-empty">

                    No detailed evaluations are available
                    for this interview.

                </div>

            `;

            return;

        }


        container.innerHTML =

            evaluations
                .map(
                    (evaluation, index) => {


                        const score =
                            Number(
                                evaluation?.score
                            ) || 0;


                        const strengths =
                            Array.isArray(
                                evaluation?.strengths
                            )
                                ? evaluation.strengths
                                : [];


                        const weaknesses =
                            Array.isArray(
                                evaluation?.weaknesses
                            )
                                ? evaluation.weaknesses
                                : [];


                        const recommendations =
                            Array.isArray(
                                evaluation?.recommendations
                            )
                                ? evaluation.recommendations
                                : [];


                        return `

                            <article class="detail-card">


                                <div class="detail-top">

                                    <span class="question-number">

                                        Question ${index + 1}

                                    </span>


                                    <span class="question-score">

                                        ${score}/100

                                    </span>

                                </div>


                                <div class="detail-question">

                                    ${escapeHtml(
                                        evaluation?.questionText ||
                                        "Question not available."
                                    )}

                                </div>


                                <div class="detail-meta">

                                    <span class="meta-pill">

                                        ${escapeHtml(
                                            evaluation?.relevance ||
                                            "Unknown"
                                        )}
                                        relevance

                                    </span>


                                    <span class="meta-pill">

                                        ${
                                            Number(
                                                evaluation?.fillerWords
                                            ) || 0
                                        }
                                        filler words

                                    </span>


                                    <span class="meta-pill">

                                        Technical:
                                        ${escapeHtml(
                                            evaluation?.technicalAccuracy ||
                                            "Unknown"
                                        )}

                                    </span>

                                </div>


                                <div class="detail-feedback">


                                    <div class="detail-feedback-section">

                                        <h4>
                                            Strengths
                                        </h4>


                                        ${
                                            renderDetailList(
                                                strengths
                                            )
                                        }

                                    </div>


                                    <div class="detail-feedback-section">

                                        <h4>
                                            Areas to Improve
                                        </h4>


                                        ${
                                            renderDetailList(
                                                weaknesses
                                            )
                                        }

                                    </div>


                                    <div class="detail-feedback-section">

                                        <h4>
                                            Recommendations
                                        </h4>


                                        ${
                                            renderDetailList(
                                                recommendations
                                            )
                                        }

                                    </div>


                                </div>


                            </article>

                        `;

                    }
                )
                .join("");

    }


    /* ============================================================
       DETAIL LIST
       ============================================================ */

    function renderDetailList(
        items
    ) {

        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            return `

                <span class="feedback-empty">

                    None available.

                </span>

            `;

        }


        return `

            <ul>

                ${
                    items
                        .map(
                            item =>
                                `<li>${escapeHtml(item)}</li>`
                        )
                        .join("")
                }

            </ul>

        `;

    }


    /* ============================================================
       ERROR STATE
       ============================================================ */

    function showError(
        title,
        message
    ) {

        document.getElementById(
            "resultShell"
        ).innerHTML = `

            <div class="result-card result-state">

                <div class="result-state-content">

                    <div class="result-state-icon">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                    </div>


                    <h2>

                        ${escapeHtml(title)}

                    </h2>


                    <p>

                        ${escapeHtml(message)}

                    </p>


                    <a
                            href="setup-interview.html"
                            class="result-action primary">

                        <i class="fa-solid fa-play"></i>

                        Start Interview

                    </a>

                </div>

            </div>

        `;

    }


    /* ============================================================
       LOAD RESULT
       ============================================================ */

    async function loadResult() {

        try {


            /* ----------------------------------------------------
               INTERVIEW
               ---------------------------------------------------- */

            const interview =
                await getInterview(
                    interviewId
                );


            console.log(
                "[result] Interview:",
                interview
            );


            if (!interview) {

                throw new Error(
                    "Interview data was not found."
                );

            }


            if (
                interview.status &&
                interview.status !== "EVALUATED"
            ) {

                showError(
                    "Interview not evaluated",
                    "This interview has not been evaluated yet."
                );

                return;

            }


            /* ----------------------------------------------------
               ROLE
               ---------------------------------------------------- */

            document.getElementById(
                "roleLabel"
            ).textContent =
                interview.role ||
                "interview";


            /* ----------------------------------------------------
               FINAL SCORE
               ---------------------------------------------------- */

            const score =
                Number(
                    interview.finalScore
                ) || 0;


            renderScore(
                score
            );


            /* ----------------------------------------------------
               EVALUATIONS
               ---------------------------------------------------- */

            const evaluations =
                await getEvaluation(
                    interviewId
                );


            console.log(
                "[result] Evaluations:",
                evaluations
            );


            const safeEvaluations =
                Array.isArray(evaluations)
                    ? evaluations
                    : [];


            /* ----------------------------------------------------
               SUMMARY
               ---------------------------------------------------- */

            const strengths = [];

            const weaknesses = [];

            const recommendations = [];

            let totalFillerWords = 0;


            safeEvaluations.forEach(
                evaluation => {


                    totalFillerWords +=
                        Number(
                            evaluation?.fillerWords
                        ) || 0;


                    if (
                        Array.isArray(
                            evaluation?.strengths
                        )
                    ) {

                        strengths.push(
                            ...evaluation.strengths
                        );

                    }


                    if (
                        Array.isArray(
                            evaluation?.weaknesses
                        )
                    ) {

                        weaknesses.push(
                            ...evaluation.weaknesses
                        );

                    }


                    if (
                        Array.isArray(
                            evaluation?.recommendations
                        )
                    ) {

                        recommendations.push(
                            ...evaluation.recommendations
                        );

                    }

                }
            );


            /* ----------------------------------------------------
               ANSWER COUNT
               ---------------------------------------------------- */

            document.getElementById(
                "answeredCount"
            ).textContent =
                safeEvaluations.length;


            /* ----------------------------------------------------
               FEEDBACK
               ---------------------------------------------------- */

            renderFeedbackList(
                "strengthsList",
                strengths,
                "strength",
                "No strengths were identified yet."
            );


            renderFeedbackList(
                "weaknessesList",
                weaknesses,
                "weakness",
                "No major weaknesses were identified."
            );


            renderFeedbackList(
                "suggestionsList",
                recommendations,
                "recommendation",
                "No recommendations are available yet."
            );


            /* ----------------------------------------------------
               RELEVANCE
               ---------------------------------------------------- */

            const relevanceScores =
                safeEvaluations
                    .map(
                        evaluation =>
                            relevanceToScore(
                                evaluation?.relevance
                            )
                    )
                    .filter(
                        value =>
                            value > 0
                    );


            const relevance =
                relevanceScores.length > 0
                    ? Math.round(
                        relevanceScores.reduce(
                            (
                                total,
                                value
                            ) =>
                                total + value,
                            0
                        ) /
                        relevanceScores.length
                    )
                    : 0;


            /* ----------------------------------------------------
               BREAKDOWN
               ---------------------------------------------------- */

            renderBreakdown(
                score,
                relevance,
                totalFillerWords
            );


            /* ----------------------------------------------------
               DETAILS
               ---------------------------------------------------- */

            renderDetailedEvaluations(
                safeEvaluations
            );


        }

        catch (error) {

            console.error(
                "[result] Failed to load result:",
                error
            );


            showError(
                "Unable to load result",
                error?.message ||
                "Something went wrong while loading your interview result."
            );

        }

    }


    /* ============================================================
       INITIALIZE
       ============================================================ */

    loadResult();

</script>

</body>
