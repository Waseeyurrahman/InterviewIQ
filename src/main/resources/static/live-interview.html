<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Interview | InterviewIQ AI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Poppins -->
    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
    >

    <!-- Centralized API client -->
    <script src="api.js"></script>


    <style>


        html,
        body {

            height: 100%;
            overflow: hidden;

            background: #f8f9fc;

            font-family: 'Poppins', sans-serif;
        }


        .interview-page {

            height: 100vh;
            overflow: hidden;
        }


        .interview-layout {

            display: grid;

            grid-template-columns:
                240px 1fr 280px;

            height: 100vh;
        }




        .ai-panel,
        .progress-panel {

            background: white;

            padding: 22px 18px;

            display: flex;
            flex-direction: column;

            overflow-y: auto;

            border-right:
                1px solid #F1F2F6;
        }


        .progress-panel {

            border-right: none;

            border-left:
                1px solid #F1F2F6;
        }


        .panel-title {

            font-size: 13px;

            font-weight: 600;

            color: #6B7280;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 14px;
        }



        .ai-avatar-big {

            width: 80px;
            height: 80px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6C63FF,
                    #8A7CFF
                );

            color: white;

            font-size: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 10px;

            box-shadow:
                0 8px 20px
                rgba(108,99,255,0.25);
        }


        .ai-tagline {

            text-align: center;

            font-size: 12.5px;

            color: #6B7280;

            margin-bottom: 18px;
        }




        .tips-block h4 {

            font-size: 11.5px;

            font-weight: 600;

            color: #6B7280;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 10px;
        }


        .tips-list {

            list-style: none;

            padding: 0;
            margin: 0;

            display: flex;

            flex-direction: column;

            gap: 9px;

            font-size: 12px;

            color: #374151;
        }


        .tips-list li {

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 8px 9px;

            border-radius: 8px;

            background: #fafafd;

            border: 1px solid #eeeeF3;
        }


        .tips-list i {

            width: 17px;

            text-align: center;

            color: #6C63FF;

            font-size: 12px;
        }




        .interview-main {

            display: flex;

            flex-direction: column;

            height: 100vh;

            overflow: hidden;

            padding: 16px 26px;
        }




        .live-bar {

            flex-shrink: 0;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px 14px;

            background: white;

            border:
                1px solid #F1F2F6;

            border-radius: 10px;

            margin-bottom: 16px;
        }


        .live-indicator {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            font-size: 12.5px;

            font-weight: 600;

            color: #EF4444;
        }


        .live-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #EF4444;

            animation:
                liveDot 1.4s
                ease-in-out infinite;
        }


        @keyframes liveDot {

            0%,
            100% {

                box-shadow:
                    0 0 0 0
                    rgba(239,68,68,0.6);
            }

            50% {

                box-shadow:
                    0 0 0 6px
                    rgba(239,68,68,0);
            }
        }


        .live-timer {

            font-size: 14px;

            font-weight: 600;

            color: #111827;

            font-variant-numeric:
                tabular-nums;
        }


        .live-timer.ending {

            color: #EF4444;
        }




        .question-header {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 12px;

            color: #6B7280;

            margin-bottom: 10px;

            flex-wrap: wrap;
        }


        .q-tag {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            background: #EEF2FF;

            color: #6C63FF;

            padding: 4px 10px;

            border-radius: 999px;

            font-weight: 600;

            font-size: 11px;
        }


        .q-status {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            color: #22c55e;

            font-weight: 600;
        }


        .q-status i {

            font-size: 6px;
        }


        .question-text {

            font-size: 22px;

            font-weight: 600;

            color: #111827;

            line-height: 1.4;

            margin: 6px 0 18px;
        }



        .answer-input {

            flex: 1;

            min-height: 0;

            width: 100%;

            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            color: #111827;

            background: white;

            border:
                1px solid #E5E7EB;

            border-radius: 12px;

            padding: 14px 16px;

            resize: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .answer-input:focus {

            outline: none;

            border-color: #6C63FF;

            box-shadow:
                0 0 0 3px
                rgba(108,99,255,0.12);
        }


        .answer-input::placeholder {

            color: #9CA3AF;
        }




        .interview-actions {

            flex-shrink: 0;

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 14px;
        }


        .btn-mic,
        .btn-submit {

            font-family: 'Poppins', sans-serif;

            font-size: 13.5px;

            font-weight: 500;

            padding: 10px 18px;

            border-radius: 10px;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .btn-mic {

            background: white;

            color: #374151;

            border:
                1px solid #E5E7EB;
        }


        .btn-mic i {

            font-size: 13px;

            color: #6C63FF;
        }


        .btn-mic:hover {

            background: #F3F4F6;

            border-color: #D1D5DB;
        }


        .btn-mic.recording {

            background: #FEF2F2;

            color: #EF4444;

            border-color: #FCA5A5;

            animation:
                micPulse 1.2s
                ease-in-out infinite;
        }


        .btn-mic.recording i {

            color: #EF4444;
        }


        @keyframes micPulse {

            0%,
            100% {

                box-shadow:
                    0 0 0 0
                    rgba(239,68,68,0.4);
            }

            50% {

                box-shadow:
                    0 0 0 6px
                    rgba(239,68,68,0);
            }
        }


        .btn-submit {

            background:
                linear-gradient(
                    135deg,
                    #6C63FF,
                    #8A7CFF
                );

            color: white;

            border: none;

            box-shadow:
                0 4px 12px
                rgba(108,99,255,0.28);
        }


        .btn-submit i {

            font-size: 11px;
        }


        .btn-submit:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 6px 16px
                rgba(108,99,255,0.38);
        }


        .btn-submit:disabled,
        .btn-mic:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }




        .participants-wrapper {

            display: flex;

            justify-content: center;

            margin-bottom: 22px;
        }


        .participants-container {

            display: flex;

            gap: 16px;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;
        }


        .participant-card {

            width: 120px;

            padding: 16px;

            border-radius: 12px;

            background: white;

            text-align: center;

            border:
                2px solid transparent;

            transition:
                all 0.3s ease;
        }


        .participant-avatar {

            width: 48px;
            height: 48px;

            border-radius: 50%;

            margin: 0 auto 8px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 19px;

            background:
                linear-gradient(
                    135deg,
                    #6C63FF,
                    #8A7CFF
                );

            color: white;

            box-shadow:
                0 4px 12px
                rgba(108,99,255,0.25);
        }


        .participant-card.user
        .participant-avatar {

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            box-shadow:
                0 4px 12px
                rgba(34,197,94,0.25);
        }


        .participant-name {

            font-size: 12px;

            font-weight: 600;

            color: #111827;

            margin-top: 2px;
        }


        .participant-status {

            font-size: 10.5px;

            color: #6B7280;

            margin-top: 4px;

            min-height: 14px;

            font-weight: 500;
        }


        .ai-active {

            border:
                2px solid #6d5dfc;

            box-shadow:
                0 0 12px
                rgba(109,93,252,0.5);
        }


        .ai-active
        .participant-status {

            color: #6C63FF;
        }


        .user-active {

            border:
                2px solid #22c55e;

            box-shadow:
                0 0 12px
                rgba(34,197,94,0.5);
        }


        .user-active
        .participant-status {

            color: #16a34a;
        }


        .dim {

            opacity: 0.5;
        }




        .save-status {

            min-height: 18px;

            margin-top: 7px;

            text-align: right;

            font-size: 11px;

            color: #6B7280;
        }


        .save-status.saving {

            color: #6C63FF;
        }


        .save-status.saved {

            color: #16a34a;
        }


        .save-status.error {

            color: #EF4444;
        }



        @media (max-width: 1100px) {

            .interview-layout {

                grid-template-columns:
                    200px 1fr 240px;
            }
        }


        @media (max-width: 800px) {

            html,
            body,
            .interview-page {

                height: auto;

                overflow: auto;
            }


            .interview-layout {

                grid-template-columns: 1fr;

                height: auto;
            }


            .ai-panel,
            .progress-panel {

                border: none;
            }


            .interview-main {

                height: auto;

                min-height: 70vh;
            }

        }

    </style>

    let interviewData = null;

    let questions = [];

    let currentIndex = 0;

    let isSubmitting = false;

    let isInitializing = true;


    /*
     * Stores answers that have already been
     * successfully saved to the database.
     *
     * key   = question ID
     * value = answer text
     */
    const savedAnswers =
        new Map();



    function showQuestion(index) {

        const question =
            questions[index];


        if (!question) {
            return;
        }


        currentIndex =
            index;


        document.getElementById(
            "qNum"
        ).textContent =
            index + 1;


        document.getElementById(
            "qTotal"
        ).textContent =
            questions.length;


        document.getElementById(
            "qTag"
        ).innerHTML = `
            <i class="fa-solid fa-circle-question"></i>
            Interview Question
        `;


        document.getElementById(
            "questionText"
        ).textContent =
            question.question;


        /*
         * Restore the saved answer for this question.
         *
         * This is important when the user:
         * - refreshes
         * - resumes an interview
         * - moves through questions
         */
        const saved =
            savedAnswers.get(
                Number(question.id)
            );


        document.getElementById(
            "answerInput"
        ).value =
            saved || "";


        if (saved) {

            setSaveStatus(
                "Answer saved",
                "saved"
            );

        }

        else {

            setSaveStatus(
                "",
                ""
            );
        }


        baselineText =
            saved || "";


        setSpeaker("ai");
    }



    function setSaveStatus(
        message,
        type
    ) {

        const element =
            document.getElementById(
                "saveStatus"
            );


        element.textContent =
            message || "";


        element.className =
            "save-status";


        if (type) {

            element.classList.add(type);

        }
    }



    (function wireAnswerInput() {

        const input =
            document.getElementById(
                "answerInput"
            );


        const activate =
            () => {

                setSpeaker("user");

            };


        input.addEventListener(
            "focus",
            activate
        );


        input.addEventListener(
            "input",
            activate
        );

    })();




    async function saveCurrentAnswer() {

        const input =
            document.getElementById(
                "answerInput"
            );


        const typed =
            input.value.trim();


        if (!typed) {

            throw new Error(
                "Please type or speak an answer before submitting."
            );
        }


        const currentQuestion =
            questions[currentIndex];


        if (!currentQuestion) {

            throw new Error(
                "Current question is unavailable."
            );
        }


        setSaveStatus(
            "Saving answer...",
            "saving"
        );


        /*
         * THIS IS THE IMPORTANT DATABASE CALL.
         *
         * api.js:
         * POST /answers/{questionId}
         */
        await saveAnswerToServer(
            currentQuestion.id,
            typed
        );


        /*
         * Only update local state AFTER
         * the server confirms successful save.
         */
        savedAnswers.set(
            Number(currentQuestion.id),
            typed
        );


        setSaveStatus(
            "Answer saved",
            "saved"
        );


        console.log(
            "[interview] Answer saved:",
            currentQuestion.id
        );


        return typed;
    }



    async function submitAnswer() {

        if (isSubmitting) {
            return;
        }


        const submitButton =
            document.getElementById(
                "submitAnswerBtn"
            );


        /*
         * Stop speech recognition before
         * reading/saving the answer.
         */
        if (
            isRecording &&
            recognition
        ) {

            recognition.stop();
        }


        isSubmitting =
            true;


        submitButton.disabled =
            true;


        submitButton.innerHTML = `
            <span>Saving...</span>
        `;


        try {

            /*
             * STEP 1
             *
             * Save the current answer to DB.
             *
             * We DO NOT move to the next
             * question until this succeeds.
             */
            await saveCurrentAnswer();


            /*
             * STEP 2
             *
             * Move to the next question.
             */
            if (
                currentIndex <
                questions.length - 1
            ) {

                currentIndex++;

                showQuestion(
                    currentIndex
                );


                submitButton.disabled =
                    false;


                submitButton.innerHTML = `
                    <span>Submit Answer</span>
                    <i class="fa-solid fa-arrow-right"></i>
                `;


                isSubmitting =
                    false;


                return;
            }


            /*
             * STEP 3
             *
             * All questions answered.
             *
             * The final answer has ALREADY
             * been saved above.
             */
            await completeInterview();

        }

        catch (error) {

            console.error(
                "[interview] Answer save failed:",
                error
            );


            setSaveStatus(
                "Failed to save answer",
                "error"
            );


            alert(
                error.message ||
                "Unable to save your answer."
            );


            submitButton.disabled =
                false;


            submitButton.innerHTML = `
                <span>Submit Answer</span>
                <i class="fa-solid fa-arrow-right"></i>
            `;


            isSubmitting =
                false;
        }
    }



    async function completeInterview() {

        /*
         * isSubmitting is already true when
         * called from submitAnswer().
         */


        const submitButton =
            document.getElementById(
                "submitAnswerBtn"
            );


        submitButton.disabled =
            true;


        submitButton.innerHTML = `
            <span>Finishing...</span>
            <i class="fa-solid fa-spinner fa-spin"></i>
        `;


        try {

            /*
             * At this point every submitted answer
             * has already been persisted individually.
             */
            await finishInterview(
                interviewId
            );


            /*
             * Go to evaluation/submitting page.
             */
            window.location.href =
                "submitting.html?interviewId=" +
                encodeURIComponent(
                    interviewId
                );

        }

        catch (error) {

            console.error(
                "[interview] Finish failed:",
                error
            );


            alert(
                error.message ||
                "Unable to finish the interview."
            );


            submitButton.disabled =
                false;


            submitButton.innerHTML = `
                <span>Submit Answer</span>
                <i class="fa-solid fa-arrow-right"></i>
            `;


            isSubmitting =
                false;
        }
    }


    //voice input
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;

    let isRecording = false;

    let baselineText = "";


    function onStartSpeaking() {

        setSpeaker("user");

        toggleMic();
    }


    function toggleMic() {

        if (!recognition) {

            alert(
                "Voice input isn't supported in this browser. Try Chrome or Edge."
            );

            return;
        }


        if (isRecording) {

            recognition.stop();

            return;
        }


        baselineText =
            document.getElementById(
                "answerInput"
            ).value;


        try {

            recognition.start();

        }

        catch (error) {

            console.error(
                "Could not start speech recognition:",
                error
            );
        }
    }


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            true;


        recognition.interimResults =
            true;


        recognition.lang =
            "en-US";


        const micBtn =
            document.getElementById(
                "micBtn"
            );


        const micLabel =
            document.getElementById(
                "micLabel"
            );


        const input =
            document.getElementById(
                "answerInput"
            );


        recognition.onstart =
            () => {

                isRecording =
                    true;


                micBtn.classList.add(
                    "recording"
                );


                micLabel.textContent =
                    "Stop Recording";


                setSpeaker("user");
            };


        recognition.onresult =
            event => {

                let finalText =
                    "";


                let interimText =
                    "";


                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {

                    const transcript =
                        event.results[i][0]
                            .transcript;


                    if (
                        event.results[i]
                            .isFinal
                    ) {

                        finalText +=
                            transcript + " ";

                    }

                    else {

                        interimText +=
                            transcript;
                    }
                }


                if (finalText) {

                    baselineText +=
                        finalText;
                }


                input.value =
                    (
                        baselineText +
                        interimText
                    )
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .trimStart();


                setSpeaker("user");
            };


        recognition.onerror =
            event => {

                console.error(
                    "Speech recognition error:",
                    event.error
                );


                if (
                    event.error ===
                        "not-allowed" ||

                    event.error ===
                        "service-not-allowed"
                ) {

                    alert(
                        "Please allow microphone access to use voice input."
                    );
                }
            };


        recognition.onend =
            () => {

                isRecording =
                    false;


                micBtn.classList.remove(
                    "recording"
                );


                micLabel.textContent =
                    "Start Speaking";
            };
    }


   //active speaker
    function setSpeaker(who) {

        const ai =
            document.getElementById(
                "aiCard"
            );


        const user =
            document.getElementById(
                "userCard"
            );


        const aiStatus =
            document.getElementById(
                "aiStatus"
            );


        const userStatus =
            document.getElementById(
                "userStatus"
            );


        ai.classList.remove(
            "ai-active",
            "dim"
        );


        user.classList.remove(
            "user-active",
            "dim"
        );


        if (who === "ai") {

            ai.classList.add(
                "ai-active"
            );


            user.classList.add(
                "dim"
            );


            aiStatus.textContent =
                "Speaking...";


            userStatus.textContent =
                "Listening...";

        }

        else if (who === "user") {

            user.classList.add(
                "user-active"
            );


            ai.classList.add(
                "dim"
            );


            aiStatus.textContent =
                "Listening...";


            userStatus.textContent =
                "Speaking...";

        }

        else {

            ai.classList.add(
                "dim"
            );


            user.classList.add(
                "dim"
            );


            aiStatus.textContent =
                "Idle";


            userStatus.textContent =
                "Idle";
        }
    }


   //server authoratative timer
    let totalSeconds = 0;

    let timerInterval = null;


    function renderTimer() {

        const mins =
            Math.floor(
                totalSeconds / 60
            );


        const secs =
            totalSeconds % 60;


        document.getElementById(
            "timer"
        ).textContent =

            String(mins)
                .padStart(2, "0")

            + ":" +

            String(secs)
                .padStart(2, "0");
    }


    function startTimer() {

        if (!interviewData) {

            throw new Error(
                "Interview data is not available."
            );
        }


        if (!interviewData.startedAt) {

            throw new Error(
                "Interview start time is not available."
            );
        }


        const startedAt =
            new Date(
                interviewData.startedAt
            );


        if (
            Number.isNaN(
                startedAt.getTime()
            )
        ) {

            throw new Error(
                "Invalid interview start time."
            );
        }


        const durationMs =
            interviewData.duration *
            60 *
            1000;


        const deadline =
            startedAt.getTime() +
            durationMs;


        function updateTimer() {

            const remainingMs =
                Math.max(
                    0,
                    deadline -
                    Date.now()
                );


            totalSeconds =
                Math.ceil(
                    remainingMs / 1000
                );


            renderTimer();


            if (
                totalSeconds <= 60
            ) {

                document
                    .getElementById(
                        "timer"
                    )
                    .classList.add(
                        "ending"
                    );
            }


            if (
                remainingMs <= 0
            ) {

                clearInterval(
                    timerInterval
                );


                saveAndFinishOnTimeout();
            }
        }


        updateTimer();


        timerInterval =
            setInterval(
                updateTimer,
                1000
            );
    }


  //save = finish timeout

    async function saveAndFinishOnTimeout() {

        if (isSubmitting) {
            return;
        }


        isSubmitting =
            true;


        const submitButton =
            document.getElementById(
                "submitAnswerBtn"
            );


        submitButton.disabled =
            true;


        submitButton.innerHTML = `
            <span>Time's Up...</span>
            <i class="fa-solid fa-spinner fa-spin"></i>
        `;


        try {

            /*
             * Save whatever is currently typed
             * for the current question.
             */
            const input =
                document.getElementById(
                    "answerInput"
                );


            const typed =
                input.value.trim();


            const currentQuestion =
                questions[currentIndex];


            if (
                typed &&
                currentQuestion
            ) {

                await saveAnswerToServer(
                    currentQuestion.id,
                    typed
                );


                savedAnswers.set(
                    Number(currentQuestion.id),
                    typed
                );


                console.log(
                    "[interview] Timeout answer saved:",
                    currentQuestion.id
                );
            }


            /*
             * Finish only after the current answer
             * has been saved successfully.
             */
            await finishInterview(
                interviewId
            );


            window.location.href =
                "submitting.html?interviewId=" +
                encodeURIComponent(
                    interviewId
                );

        }

        catch (error) {

            console.error(
                "[interview] Timeout finish failed:",
                error
            );


            alert(
                error.message ||
                "Your interview time ended, but we could not finish the interview."
            );


            submitButton.disabled =
                false;


            submitButton.innerHTML = `
                <span>Submit Answer</span>
                <i class="fa-solid fa-arrow-right"></i>
            `;


            isSubmitting =
                false;
        }
    }


    /* ============================================================
       LOAD SAVED ANSWERS
       ============================================================ */

    async function loadSavedAnswers() {

        savedAnswers.clear();


        const saved =
            await getAnswers(
                interviewId
            );


        if (!Array.isArray(saved)) {

            return;
        }


        saved.forEach(answer => {

            const questionId =
                Number(
                    answer.questionId
                );


            if (
                Number.isFinite(questionId) &&
                answer.answerText
            ) {

                savedAnswers.set(
                    questionId,
                    answer.answerText
                );
            }

        });


        console.log(
            "[interview] Restored saved answers:",
            savedAnswers.size
        );
    }


    /* ============================================================
       FIND RESUME QUESTION
       ============================================================ */

    function findResumeIndex() {

        /*
         * Find the first question that does
         * NOT have a saved answer.
         */
        for (
            let i = 0;
            i < questions.length;
            i++
        ) {

            const questionId =
                Number(
                    questions[i].id
                );


            if (
                !savedAnswers.has(
                    questionId
                )
            ) {

                return i;
            }
        }


        /*
         * If everything has already been answered,
         * show the last question.
         */
        return questions.length - 1;
    }



    async function initInterview() {

        try {

            isInitializing =
                true;


            /*
             * 1. Load interview.
             */
            interviewData =
                await getInterview(
                    interviewId
                );


            /*
             * 2. If this is a newly-created
             * interview, start it.
             */
            if (
                interviewData.status ===
                "CREATED"
            ) {

                await startInterview(
                    interviewId
                );


                interviewData =
                    await getInterview(
                        interviewId
                    );
            }


            /*
             * 3. Interview must be in progress.
             */
            if (
                interviewData.status !==
                "IN_PROGRESS"
            ) {

                throw new Error(
                    "This interview is not available to start."
                );
            }


            /*
             * 4. Load questions.
             */
            questions =
                await getQuestions(
                    interviewId
                );


            if (
                !Array.isArray(
                    questions
                ) ||
                questions.length === 0
            ) {

                throw new Error(
                    "The server returned no questions."
                );
            }


            document.getElementById(
                "qTotal"
            ).textContent =
                questions.length;


            /*
             * 5. CRITICAL STEP
             *
             * Load answers from DATABASE
             * before deciding which question
             * to display.
             */
            await loadSavedAnswers();


            /*
             * 6. Resume from first unanswered.
             */
            currentIndex =
                findResumeIndex();


            /*
             * 7. Display that question.
             *
             * If the user had answered Q1-Q4,
             * currentIndex will be 4.
             */
            showQuestion(
                currentIndex
            );


            /*
             * 8. Start timer using server's
             * startedAt value.
             */
            startTimer();


            isInitializing =
                false;

        }

        catch (error) {

            console.error(
                "[interview] Initialization failed:",
                error
            );


            document.getElementById(
                "questionText"
            ).textContent =
                "Unable to start this interview.";


            document.getElementById(
                "answerInput"
            ).disabled =
                true;


            document.getElementById(
                "submitAnswerBtn"
            ).disabled =
                true;


            setSpeaker(null);


            alert(
                error.message ||
                "Unable to start the interview."
            );
        }
    }


    /* ============================================================
       PREVENT ACCIDENTAL DOUBLE SUBMISSION
       ============================================================ */

    window.addEventListener(
        "beforeunload",
        () => {

            /*
             * We deliberately DO NOT attempt an API
             * request here.
             *
             * Browser unload is unreliable for normal
             * fetch requests.
             *
             * Answers are persisted when the user
             * clicks Submit Answer.
             */
        }
    );


    /* ============================================================
       START
       ============================================================ */

    initInterview();

</script>
