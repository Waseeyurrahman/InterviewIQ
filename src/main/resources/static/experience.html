<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Step 2 - Experience | InterviewIQ AI</title>

    <link rel="stylesheet" href="style.css" />

    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
    >
</head>

<body class="setup-panel-page">

<div class="main-container">

    <!-- ===== TOP: Header + Stepper + Section title ===== -->
    <div class="top-section">

        <div class="panel-header">
            <h1>Let's set up your interview</h1>
            <p>Tell us about your preferences</p>
        </div>

        <!-- Stepper -->
        <div class="step-bar">

            <div class="step done">
                <div class="step-circle">✓</div>
                <div class="step-label">Role</div>
            </div>

            <div class="step-line"></div>

            <div class="step active">
                <div class="step-circle">2</div>
                <div class="step-label">Experience</div>
            </div>

            <div class="step-line"></div>

            <div class="step">
                <div class="step-circle">3</div>
                <div class="step-label">Difficulty</div>
            </div>

            <div class="step-line"></div>

            <div class="step">
                <div class="step-circle">4</div>
                <div class="step-label">Duration</div>
            </div>

        </div>

        <!-- Section heading -->
        <div class="section-heading">
            <h2>Select Your Experience Level</h2>
            <p>This helps us personalize questions for you</p>
        </div>

    </div>


    <!-- ===== MIDDLE: Experience cards ===== -->

    <div class="experience-row">

        <!-- Entry Level -->
        <div
                class="experience-card"
                data-value="Entry-Level (0–1 years)"
        >
            <div class="exp-icon">🎓</div>

            <div class="exp-title">
                Entry-Level
            </div>

            <div class="exp-subtitle">
                0–1 years
            </div>
        </div>


        <!-- Junior -->
        <div
                class="experience-card"
                data-value="Junior (1–3 years)"
        >
            <div class="exp-icon">🌱</div>

            <div class="exp-title">
                Junior
            </div>

            <div class="exp-subtitle">
                1–3 years
            </div>
        </div>


        <!-- Mid-Level -->
        <div
                class="experience-card"
                data-value="Mid-Level (3–7 years)"
        >
            <div class="exp-icon">💼</div>

            <div class="exp-title">
                Mid-Level
            </div>

            <div class="exp-subtitle">
                3–7 years
            </div>
        </div>


        <!-- Senior -->
        <div
                class="experience-card"
                data-value="Senior (7–12 years)"
        >
            <div class="exp-icon">🚀</div>

            <div class="exp-title">
                Senior
            </div>

            <div class="exp-subtitle">
                7–12 years
            </div>
        </div>


        <!-- Lead / Expert -->
        <div
                class="experience-card"
                data-value="Lead / Expert (12+ years)"
        >
            <div class="exp-icon">🏆</div>

            <div class="exp-title">
                Lead / Expert
            </div>

            <div class="exp-subtitle">
                12+ years
            </div>
        </div>

    </div>


    <!-- ===== BOTTOM: Action buttons ===== -->

    <div class="footer-actions">

        <button
                class="btn-back"
                onclick="window.location.href='setup-role.html'"
        >
            ← Back
        </button>

        <button
                class="btn-next"
                onclick="goNext()"
        >
            Next →
        </button>

    </div>

</div>


<script>

    const STORAGE_KEY = "experience";

    const NEXT_PAGE = "difficulty.html";


    // Restore previously selected experience
    let selected =
      localStorage.getItem(STORAGE_KEY) || null;


    // Handle experience selection
    document
      .querySelectorAll(".experience-card")
      .forEach(card => {

        // Restore selected card
        if (card.dataset.value === selected) {
          card.classList.add("selected");
        }


        // Select card
        card.addEventListener("click", () => {

          document
            .querySelectorAll(".experience-card")
            .forEach(c =>
              c.classList.remove("selected")
            );


          card.classList.add("selected");


          selected = card.dataset.value;


          localStorage.setItem(
            STORAGE_KEY,
            selected
          );

        });

      });


    // Continue to difficulty
    function goNext() {

      if (!selected) {

        alert(
          "Please select your experience level."
        );

        return;
      }


      window.location.href = NEXT_PAGE;

    }

</script>

</body>
</html>
